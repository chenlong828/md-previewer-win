<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="./bundle.css">
    <title>MDPreview</title>
</head>
<body>
    <div id="app"></div>
    <pre id="code-view" tabindex="-1" aria-label="代码视图"><code></code></pre>
    <textarea id="source-editor" spellcheck="false" aria-label="源码模式"></textarea>
    <div id="find-bar" role="search">
        <input id="find-input" type="text" placeholder="查找…" spellcheck="false">
        <span id="find-count" class="find-count">0/0</span>
        <button id="find-prev" title="上一个 (Shift+Enter)">↑</button>
        <button id="find-next" title="下一个 (Enter)">↓</button>
        <button id="find-close" title="关闭 (Esc)">✕</button>
    </div>
    <script src="./bundle.js"></script>
</body>
</html>
